[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annealing-curriculum"
version = "0.1.0"
description = "Annealing phase curriculum with synthetic injection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pyyaml", "tqdm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
